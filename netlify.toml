[build]
  command = "npm run build"
  publish = "dist"

# Ignore these keys from secrets scan:
# - GEMINI_API_KEY (server-side only, read by netlify/functions/_lib/llm.ts;
#   listed because the scanner otherwise flags it and blocks the build)
# - STRAVA_CLIENT_SECRET / STRAVA_CLIENT_ID (server-side only, still read by
#   oauth-refresh; nothing Strava reaches the bundle any more)
# - VITE_GOOGLE_CLIENT_ID / GOOGLE_CLIENT_ID (same value, and an OAuth client ID
#   is public by design — it ships in the bundle so the sign-in button can work)
# Without this, Netlify scanner flags them as secrets and blocks the build
#
# RUNALYZE_API_TOKEN is deliberately NOT listed: it must never reach the bundle,
# so if the scanner ever finds it, the build should fail.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "STRAVA_CLIENT_SECRET,STRAVA_CLIENT_ID,GEMINI_API_KEY,VITE_GOOGLE_CLIENT_ID,GOOGLE_CLIENT_ID"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

# Vite special paths - must exclude from SPA catch-all
[[redirects]]
  from = "/@*"
  to = "/@:splat"
  status = 200

# Vite dependency paths (some setups still use this)
[[redirects]]
  from = "/node_modules/*"
  to = "/node_modules/:splat"
  status = 200

[[redirects]]
  from = "/src/*"
  to = "/src/:splat"
  status = 200

# SPA catch-all (LAST)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
